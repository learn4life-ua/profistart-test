<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProfiStart — профорієнтаційний тест</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --k-green: #009846;
      --k-red: #AE2220;
      --k-yellow: #FFED00;
      --k-blue: #152731;
      --bg: #f3f4f6;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); }
    .btn-green { background: var(--k-green); }
    .btn-green:hover { filter: brightness(.93); }
    .btn-outline { border: 2px solid rgba(21, 39, 49, .22); color: var(--k-blue); background: #fff; }
    .btn-outline:hover { background: rgba(21, 39, 49, .05); }
    .option-picked { border-color: rgba(0, 152, 70, .55) !important; background: rgba(0, 152, 70, .08) !important; }
    .missing { outline: 3px solid rgba(174, 34, 32, .55); outline-offset: 2px; }
    .result-bar { transition: width 900ms ease-in-out; }
    .pill { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .7rem; border-radius: 999px; border: 1px solid rgba(21, 39, 49, .15); background: #fff; font-size: .85rem; color: var(--k-blue); }
    a.linkish { color: var(--k-blue); text-decoration: underline; }
    a.linkish:hover { opacity: .85; }
  </style>
</head>

<body class="p-4 sm:p-8">
  <div id="app" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-5 sm:p-10 my-6">

    <!-- HEADER -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full font-semibold"
           style="background: rgba(0, 152, 70, .10); color: var(--k-blue); border: 1px solid rgba(0, 152, 70, .22);">
        🎓 <span>ProfiStart</span>
      </div>

      <h1 class="text-3xl sm:text-4xl font-extrabold mt-4" style="color: var(--k-blue);">
        Обери свої інтереси — знайди свою професію!
      </h1>

      <p class="text-gray-700 mt-3 max-w-2xl mx-auto">
        Вибір професії — це як купити свіжий хліб: наче просто, а насправді важливо не прогадати 😉
      </p>

      <div class="flex flex-wrap justify-center gap-2 mt-4">
        <span class="pill">⏱️ ~ 5 хв</span>
        <span class="pill">🧠 30 питань</span>
        <span class="pill">🎯 7 ОПП</span>
      </div>
    </header>

    <!-- PROGRESS -->
    <div id="progress-wrap" class="mb-6">
      <div class="flex items-center justify-between gap-3 mb-2">
        <p id="page-label" class="font-semibold" style="color: var(--k-blue);"></p>
        <p id="answered-label" class="text-sm text-gray-600 hidden sm:block"></p>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
        <div id="progress-bar" class="h-2.5 rounded-full" style="background: var(--k-green); width: 0%"></div>
      </div>
    </div>

    <!-- QUESTIONS -->
    <div id="test-container" class="space-y-5"></div>

    <!-- NAV (Липкість прибрано) -->
    <div id="nav-container" class="mt-8">
      <div class="bg-white rounded-2xl p-3 border" style="border-color: rgba(21, 39, 49, .15);">
        <p id="error-message" class="text-center mb-2 hidden font-medium" style="color: var(--k-red);">
          Є пропущені питання на цьому екрані — я підсвітила їх.
        </p>

        <div class="flex flex-col sm:flex-row gap-3">
          <button id="prev-btn" onclick="prevPage()"
            class="w-full sm:w-auto px-5 py-3 rounded-xl btn-outline font-semibold">
            ← Назад
          </button>

          <button id="next-btn" onclick="nextPage()"
            class="w-full sm:flex-1 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 transform hover:scale-[1.01] focus:outline-none btn-green">
            Далі →
          </button>

          <button id="submit-btn" onclick="calculateResults()"
            class="w-full sm:flex-1 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 transform hover:scale-[1.01] focus:outline-none btn-green hidden">
            Показати результат →
          </button>
        </div>
      </div>
    </div>

    <!-- RESULTS -->
    <div id="results-container" class="mt-12 pt-8 border-t-2 border-gray-200 hidden">
      <h2 class="text-2xl font-bold text-center mb-6" style="color: var(--k-blue);">Твій результат</h2>

      <div id="results-summary" class="space-y-4 mb-8"></div>

      <div class="p-6 rounded-2xl shadow-inner"
           style="background: rgba(21, 39, 49, .06); border: 1px solid rgba(21, 39, 49, .18);">
        <h3 class="text-xl font-semibold mb-2" style="color: var(--k-blue);">Пояснення</h3>
        <p id="dominant-opp" class="text-lg font-semibold mb-4" style="color: var(--k-blue);"></p>

        <div id="interpretation-text" class="text-gray-800 space-y-3"></div>

        <div id="opp-links" class="mt-7"></div>

        <div class="mt-8 flex flex-col sm:flex-row gap-3">
          <button onclick="resetTest()"
            class="w-full sm:w-auto px-5 py-3 rounded-xl btn-outline font-semibold">
            Пройти тест ще раз
          </button>
          <a href="#app" class="w-full sm:w-auto px-5 py-3 rounded-xl text-white font-semibold text-center"
             style="background: var(--k-blue);">
            Вгору
          </a>
        </div>
      </div>
    </div>

  </div>

      options:[
        {k:"org", t:"«Маємо чіткий план — отже все встигнемо»"},
        {k:"fin", t:"«Це принесе прибуток та відкриє нові можливості»"},
        {k:"vet", t:"«Головне — допомогти та забезпечити здоров’я»"},
        {k:"land",t:"«Тут все точно до міліметра, як і має бути»"}
      ]},
    { q:"25. Що ти робиш у першу чергу, отримавши відповідальний проєкт?",
      options:[
        {k:"acc", t:"Встановлюю систему обліку всіх ресурсів проєкту."},
        {k:"org", t:"Формую команду та розподіляю завдання за термінами."},
        {k:"fin", t:"Шукаю шляхи, як зробити проєкт максимально вигідним."},
        {k:"green",t:"Планую, як зробити фінальний результат естетичним."}
      ]},
    { q:"26. Якби ти міг(ла) отримати один супер-гаджет для роботи, що б це було?",
      options:[
        {k:"crop", t:"Агродрон для автоматичного сканування стану полів."},
        {k:"land", t:"Лазерний 3D-сканер для миттєвого створення цифрових карт."},
        {k:"green",t:"VR-шолом для віртуальних прогулянок по майбутньому парку."},
        {k:"vet",  t:"Біо-чіп для дистанційного моніторингу здоров’я тварин."}
      ]},
    { q:"27. Штучний інтелект (AI) стає твоїм асистентом. Яку задачу ти йому делегуєш?",
      options:[
        {k:"fin", t:"Аналіз ринків та автоматичне прогнозування прибутку."},
        {k:"acc", t:"Миттєвий пошук помилок у тисячах електронних звітів."},
        {k:"org", t:"Оптимізацію логістики та графіків роботи великої команди."},
        {k:"crop",t:"Розрахунок ідеального часу для посадки культур за даними супутника."}
      ]},
    { q:"28. Тобі запропонували протестувати новий інноваційний додаток. Його функція:",
      options:[
        {k:"land", t:"Доповнена реальність (AR), що показує межі ділянок прямо через камеру."},
        {k:"green",t:"Смарт-система, що сама керує поливом та освітленням саду."},
        {k:"vet",  t:"Телемедицина: онлайн-діагностика тварин за допомогою смарт-датчиків."},
        {k:"fin",  t:"Мобільний банкінг з автоматичним інвестиційним радником."}
      ]},
    { q:"29. Яка цифрова навичка здається тобі найбільш перспективною?",
      options:[
        {k:"acc", t:"Робота з хмарними сервісами та блокчейн-звітністю."},
        {k:"org", t:"Управління підприємством через єдину цифрову систему (ERP)."},
        {k:"land",t:"Обробка супутникових знімків для кадастрових робіт."},
        {k:"green",t:"Проектування вертикальних «смарт-лісів» у місті."}
      ]},
    { q:"30. Що для тебе «майбутнє професії»?",
      options:[
        {k:"vet",  t:"Роботизовані ферми та безконтактне лікування."},
        {k:"crop", t:"Вертикальні ферми та повна автоматизація вирощування."},
        {k:"fin",  t:"Цифрові валюти та алгоритмічне управління капіталом."},
        {k:"org",  t:"Гнучке управління проектами через нейромережі."}
      ]}
  ];

  const PER_PAGE = 5;
  let page = 0;
  const totalPages = Math.ceil(testData.length / PER_PAGE);
  const answers = Array(testData.length).fill(null);

  function pageRange() {
    const start = page * PER_PAGE;
    const end = Math.min(start + PER_PAGE, testData.length);
    return { start, end };
  }

  function answeredCount() {
    return answers.filter(v => v !== null).length;
  }

  function renderProgress() {
    const { start, end } = pageRange();
    document.getElementById('page-label').textContent = `Екран ${page+1}/${totalPages}`;
    document.getElementById('answered-label').textContent = `Відповіді: ${answeredCount()}/${testData.length}`;
    const pct = Math.round((answeredCount() / testData.length) * 100);
    document.getElementById('progress-bar').style.width = `${pct}%`;
  }

  function renderNavButtons() {
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const submitBtn = document.getElementById('submit-btn');
    const isLastPage = page === totalPages - 1;
    prevBtn.disabled = page === 0;
    prevBtn.style.opacity = page === 0 ? "0.5" : "1";
    nextBtn.classList.toggle('hidden', isLastPage);
    submitBtn.classList.toggle('hidden', !isLastPage);
  }

  function renderQuestions() {
    const container = document.getElementById('test-container');
    const { start, end } = pageRange();
    container.innerHTML = testData.slice(start, end).map((item, localIndex) => {
      const i = start + localIndex;
      const chosen = answers[i];
      return `
        <div class="question-block p-4 sm:p-5 bg-gray-50 rounded-2xl shadow-sm border-t-4" 
             style="border-top-color: var(--k-blue);" data-qindex="${i}">
          <p class="font-semibold text-lg leading-snug mb-4" style="color: var(--k-blue);">${item.q}</p>
          <div class="space-y-3">
            ${item.options.map((opt, oi) => {
              const pickedClass = (chosen === oi) ? "option-picked" : "";
              const checkedAttr = (chosen === oi) ? "checked" : "";
              return `
                <label class="flex items-start gap-3 p-3 bg-white border border-gray-200 rounded-2xl cursor-pointer 
                               hover:bg-gray-50 transition duration-150 ${pickedClass}">
                  <input type="radio" name="q${i}" value="${oi}" ${checkedAttr} 
                         class="mt-1 h-5 w-5 accent-[#009846]">
                  <span class="text-gray-900 leading-snug">${opt.t}</span>
                </label>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }).join("");
    renderProgress();
    renderNavButtons();
  }

  document.addEventListener('change', (e) => {
    if (e.target && e.target.matches('input[type="radio"]')) {
      const qIndex = Number(e.target.name.replace("q", ""));
      const optIndex = Number(e.target.value);
      answers[qIndex] = optIndex;
      const label = e.target.closest('label');
      label.closest('.space-y-3').querySelectorAll('label').forEach(l => l.classList.remove('option-picked'));
      label.classList.add('option-picked');
      const block = label.closest('.question-block');
      block.classList.remove('missing');
      renderProgress();
      setTimeout(() => {
        const nextBlock = document.querySelector(`.question-block[data-qindex="${qIndex + 1}"]`);
        if (nextBlock) nextBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 200);
    }
  });

  function validatePage() {
    const { start, end } = pageRange();
    let isValid = true;
    let firstMissing = null;
    for (let i = start; i < end; i++) {
      if (answers[i] === null) {
        document.querySelector(`.question-block[data-qindex="${i}"]`).classList.add('missing');
        if (firstMissing === null) firstMissing = i;
        isValid = false;
      }
    }
    const errorMsg = document.getElementById('error-message');
    if (!isValid) {
      errorMsg.classList.remove('hidden');
      document.querySelector(`.question-block[data-qindex="${firstMissing}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      errorMsg.classList.add('hidden');
    }
    return isValid;
  }

  function nextPage() {
    if (validatePage()) {
      page++;
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function prevPage() {
    if (page > 0) {
      page--;
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function calculateResults() {
    if (!validatePage()) return;
    const scores = { crop:0, land:0, green:0, fin:0, acc:0, org:0, vet:0 };
    answers.forEach((optIndex, qIndex) => {
      const key = testData[qIndex].options[optIndex].k;
      scores[key]++;
    });
    displayResults(scores);
  }

  function displayResults(scores) {
    const total = testData.length;
    const sorted = Object.keys(scores)
      .map(k => ({ key: k, score: scores[k] }))
      .sort((a, b) => b.score - a.score);
    const top1 = sorted[0];
    const top2 = sorted[1];
    const isMixed = (top1.score - top2.score <= 1);

    document.getElementById('results-summary').innerHTML = sorted.map(item => {
      const pct = ((item.score / total) * 100).toFixed(1);
      return `
        <div class="p-3 rounded-xl border-l-4" style="background: rgba(21, 39, 49, 0.05); border-left-color: var(--k-green);">
          <div class="flex justify-between items-center mb-1">
            <span class="font-semibold text-sm">${OPP[item.key]}</span>
            <span class="font-bold text-sm">${pct}%</span>
          </div>
          <div class="w-full bg-gray-200 rounded-full h-2">
            <div class="result-bar h-2 rounded-full" style="width: ${pct}%; background: var(--k-green);"></div>
          </div>
        </div>
      `;
    }).join("");

    document.getElementById('dominant-opp').innerHTML = isMixed 
      ? `Твій профіль: <span class="text-green-700">${OPP[top1.key]}</span> та <span class="text-green-700">${OPP[top2.key]}</span>`
      : `Твоя домінуюча схильність: <span class="text-green-700">${OPP[top1.key]}</span>`;

    document.getElementById('interpretation-text').innerHTML = `
      <div class="p-4 bg-white rounded-xl border border-gray-100 shadow-sm">
        <p class="font-bold mb-2">${OPP[top1.key]}:</p>
        ${OPP_DESC[top1.key].map(p => `<p class="mb-1">• ${p}</p>`).join("")}
      </div>
    `;

    document.getElementById('opp-links').innerHTML = `<a href="${OPP_LINKS[top1.key]}" target="_blank" class="block p-3 text-center bg-[#152731] text-white rounded-xl font-bold">Дізнатися більше про ОПП</a>`;

    document.getElementById('test-container').classList.add('hidden');
    document.getElementById('progress-wrap').classList.add('hidden');
    document.getElementById('nav-container').classList.add('hidden');
    document.getElementById('results-container').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetTest() {
    answers.fill(null);
    page = 0;
    document.getElementById('results-container').classList.add('hidden');
    document.getElementById('test-container').classList.remove('hidden');
    document.getElementById('progress-wrap').classList.remove('hidden');
    document.getElementById('nav-container').classList.remove('hidden');
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = renderQuestions;
</script>
</body>
</html>
